{% extends "students/base.html" %}

{% block title %}
Edit Kelas
{% endblock %}

{% block content %}

<div class="edit-kelas-page">

    <!-- HEADER -->
    <div class="page-header edit-kelas-header">

        <div>
            <h1>Edit Kelas</h1>
            <p>Perbarui informasi kelas</p>
        </div>

    </div>


    <!-- CARD -->
    <div class="edit-kelas-card">

        <!-- CARD HEADER -->
        <div class="edit-kelas-card-header">

            <div>
                <h2>Informasi Kelas</h2>

                <p>
                    Ubah nama kelas kemudian simpan perubahan.
                </p>
            </div>

        </div>


        <!-- FORM -->
        <form method="POST">

            {% csrf_token %}


            <!-- FORM BODY -->
            <div class="edit-kelas-form">

                <div class="form-group">

                    <label for="nama">
                        Nama Kelas
                    </label>

                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        maxlength="20"
                        value="{{ kelas.nama }}"
                        placeholder="Contoh: Kelas 1A"
                        required
                        autofocus
                    >

                    <small>
                        Maksimal 20 karakter.
                    </small>

                </div>

            </div>


            <!-- ACTIONS -->
            <div class="edit-kelas-actions">

                <a
                    href="{% url 'data_kelas' %}"
                    class="btn-batal"
                >
                    Batal
                </a>

                <button
                    type="submit"
                    class="btn-simpan"
                >
                    <span class="btn-simpan-icon">✓</span>
                    <span>Simpan Perubahan</span>
                </button>

            </div>

        </form>

    </div>

</div>


<style>

/* =========================================
   HALAMAN EDIT KELAS
========================================= */

.edit-kelas-page {
    width: 100%;
    max-width: 900px;
}

.edit-kelas-header {
    margin-bottom: 24px;
}


/* =========================================
   CARD
========================================= */

.edit-kelas-card {
    width: 100%;
    background: #ffffff;

    border: 1px solid #e5e7eb;
    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 2px 8px rgba(15, 23, 42, 0.05);
}


/* =========================================
   CARD HEADER
========================================= */

.edit-kelas-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 22px 24px;

    background: #fafafa;

    border-bottom: 1px solid #e5e7eb;
}

.edit-kelas-card-header h2 {
    margin: 0;

    font-size: 18px;
    font-weight: 600;

    color: #111827;
}

.edit-kelas-card-header p {
    margin: 6px 0 0;

    color: #6b7280;

    font-size: 13px;
    line-height: 1.5;
}


/* =========================================
   FORM
========================================= */

.edit-kelas-form {
    padding: 26px 24px;
}

.edit-kelas-form .form-group {
    width: 100%;
    max-width: 500px;

    margin: 0;
}


/* =========================================
   LABEL
========================================= */

.edit-kelas-form label {
    display: block;

    margin-bottom: 8px;

    font-size: 14px;
    font-weight: 600;

    color: #374151;
}


/* =========================================
   INPUT
========================================= */

.edit-kelas-form input[type="text"] {
    display: block;

    width: 100%;
    height: 44px;

    box-sizing: border-box;

    padding: 0 13px;

    border: 1px solid #d1d5db;
    border-radius: 8px;

    background: #ffffff;

    color: #111827;

    font-size: 14px;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

.edit-kelas-form input[type="text"]::placeholder {
    color: #9ca3af;
}

.edit-kelas-form input[type="text"]:hover {
    border-color: #9ca3af;
}

.edit-kelas-form input[type="text"]:focus {
    border-color: #2563eb;

    background: #ffffff;

    box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
}


/* =========================================
   KETERANGAN INPUT
========================================= */

.edit-kelas-form small {
    display: block;

    margin-top: 7px;

    color: #9ca3af;

    font-size: 12px;
    line-height: 1.4;
}


/* =========================================
   FOOTER / ACTION BUTTON
========================================= */

.edit-kelas-actions {
    display: flex;

    justify-content: flex-end;
    align-items: center;

    gap: 10px;

    padding: 18px 24px;

    background: #fafafa;

    border-top: 1px solid #e5e7eb;
}


/* =========================================
   TOMBOL BATAL
========================================= */

.btn-batal {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-height: 42px;

    padding: 0 17px;

    background: #ffffff;

    color: #374151;

    border: 1px solid #d1d5db;
    border-radius: 8px;

    text-decoration: none;

    font-size: 14px;
    font-weight: 600;

    box-sizing: border-box;

    cursor: pointer;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease;
}

.btn-batal:hover {
    background: #f3f4f6;

    border-color: #cbd5e1;

    color: #111827;

    text-decoration: none;
}


/* =========================================
   TOMBOL SIMPAN PERUBAHAN
========================================= */

.btn-simpan {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 9px;

    min-height: 42px;

    padding: 0 17px;

    background: #2563eb;

    color: #ffffff;

    border: 1px solid #2563eb;
    border-radius: 8px;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    box-sizing: border-box;

    box-shadow:
        0 2px 5px rgba(37, 99, 235, 0.18);

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
}

.btn-simpan:hover {
    background: #1d4ed8;

    border-color: #1d4ed8;

    color: #ffffff;

    box-shadow:
        0 4px 10px rgba(37, 99, 235, 0.25);

    transform: translateY(-1px);
}

.btn-simpan:active {
    transform: translateY(0);

    box-shadow:
        0 2px 5px rgba(37, 99, 235, 0.18);
}


/* =========================================
   ICON SIMPAN
========================================= */

.btn-simpan-icon {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    width: 21px;
    height: 21px;

    border: 1.5px solid rgba(255, 255, 255, 0.85);

    border-radius: 5px;

    font-size: 13px;
    font-weight: 400;

    line-height: 1;

    box-sizing: border-box;
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 700px) {

    .edit-kelas-page {
        max-width: 100%;
    }

    .edit-kelas-card-header {
        padding: 20px;
    }

    .edit-kelas-form {
        padding: 22px 20px;
    }

    .edit-kelas-actions {
        padding: 18px 20px;
    }

}


@media (max-width: 480px) {

    .edit-kelas-card-header {
        padding: 18px 16px;
    }

    .edit-kelas-form {
        padding: 20px 16px;
    }

    .edit-kelas-actions {
        flex-direction: column-reverse;

        align-items: stretch;

        padding: 16px;
    }

    .btn-batal,
    .btn-simpan {
        width: 100%;
    }

}

</style>

{% endblock %}
